name: Manual Build and Release WPF (.NET Framework 4.8)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore PerfectohubRu.slnx

    - name: Build the app
      run: msbuild PerfectohubRu.slnx /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload .exe to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./bin/Release/*.exe
        tag_name: manual-build-${{ github.run_number }}
        release_name: Manual Build #${{ github.run_number }}
        body: |
          .NET Framework 4.8
          Date: ${{ github.event.repository.updated_at }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}