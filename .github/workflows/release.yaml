name: Manual Build and Release WPF

on:
  workflow_dispatch:  # Только ручной запуск из интерфейса

permissions:
  contents: write  # Права на создание релиза

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 1.0.0 # Версия приложения

    - name: Publish as single .exe
      run: |
        dotnet publish PerfectohubRu.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          --output ./publish

    - name: Upload .exe to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/*.exe
        tag_name: manual-build-${{ github.run_number }}
        release_name: Manual Build #${{ github.run_number }}
        body: |
          Сборка запущена вручную.
          Дата: ${{ github.event.repository.updated_at }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}